<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro realizado - Fluux</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/sucesso.css">
</head>

<body>

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="auth-topo">

        <a href="../index.html" class="logo">
            <img
                src="../assets/images/logos/logo fluux BRANCA.png"
                alt="Fluux"
                class="logo-img"
            >
        </a>

    </header>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="sucesso-wrapper">

        <section class="sucesso-card">


            <!-- LOGO DENTRO DO CARD -->

            <div class="sucesso-marca">

                <img
                    src="../assets/images/logos/logo fluux BRANCA.png"
                    alt="Fluux"
                    class="sucesso-logo"
                >

            </div>


            <!-- ÍCONE DE SUCESSO -->

            <div class="sucesso-icone">
                ✓
            </div>


            <!-- TÍTULO -->

            <h1>
                Cadastro realizado!
            </h1>


            <!-- MENSAGEM -->

            <p class="mensagem">
                Sua conta foi criada com sucesso.
                <br>

                Agora você já pode entrar no
                <strong>Fluux</strong>
                e começar sua jornada.
            </p>


            <!-- BOTÕES -->

            <div class="sucesso-botoes">

                <a
                    href="login.html"
                    class="sucesso-btn sucesso-btn-login"
                >
                    Fazer Login
                </a>


                <a
                    href="../index.html"
                    class="sucesso-btn sucesso-btn-home"
                >
                    Voltar para a página inicial
                </a>

            </div>


            <!-- LINKS -->

            <div class="sucesso-links">

                <a href="cadastro.html">
                    Criar outra conta
                </a>

                <span>•</span>

                <a href="login.html">
                    Acessar minha conta
                </a>

            </div>


            <!-- FOOTER -->

            <p class="sucesso-footer">
                © 2026 Fluux. Todos os direitos reservados.
            </p>

        </section>

    </main>

</body>

</html>
