    <script>
        const params = new URLSearchParams(window.location.search);
        const nome = params.get('nome');
        const email = params.get('email');

        if (nome || email) {
            const caixa = document.getElementById('caixa-detalhes');
            caixa.classList.add('ativo');

            if (nome) {
                document.getElementById('titulo-boas-vindas').textContent = `Bem-vindo(a), ${nome}!`;
                document.getElementById('dado-nome').textContent = nome;
            }

            if (email) {
                document.getElementById('dado-email').textContent = email;
            }
        }

        // Contador para redirecionamento suave automático
        let tempoRestante = 4;
        const spanSegundos = document.getElementById('segundos');

        const intervalo = setInterval(() => {
            tempoRestante--;
            if (spanSegundos) spanSegundos.textContent = tempoRestante;
            if (tempoRestante <= 0) {
                clearInterval(intervalo);
                window.location.href = '../index.php';
            }
        }, 1000);
    </script>
